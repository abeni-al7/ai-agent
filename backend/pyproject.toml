[project]
name = "wekil"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "abeni-al7", email = "abenezeralebachew3@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.4",
    "google-api-python-client>=2.202.0",
    "google-auth>=2.62.2",
    "google-auth-oauthlib>=1.5.0",
    "google-genai>=3.0.0",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "lxml>=6.1.3",
    "psycopg[binary]>=3.3.8",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.33",
    "rapidfuzz>=3.14.6",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI Depends/Form defaults

[tool.pytest.ini_options]
pythonpath = ["src"]
